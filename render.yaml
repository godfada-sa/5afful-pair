services:
  - type: web
    name: 5afful-pair
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # 22+ can load the ES-module WhatsApp library; the site also works on 20 via dynamic import
      - key: NODE_VERSION
        value: "22"
